<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Resume Builder
<h1>    

Designed & Developed by Injmam Ali 

 </h1></title>

<link rel="stylesheet" href="style.css">

<!-- Font Awesome -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- html2pdf -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

</head>
<body>

<div class="container">

<!-- ================= LEFT SIDE ================= -->

<div class="form">

<h2>Resume Builder</h2>

<label>Profile Photo</label>
<input type="file" id="photo" accept="image/*">

<label>Full Name</label>
<input type="text" id="name">

<label>Job Title</label>
<input type="text" id="job">

<label>Email</label>
<input type="email" id="email">

<label>Phone</label>
<input type="text" id="phone">

<label>Address</label>
<input type="text" id="address">

<label>Professional Summary</label>
<textarea id="summary"></textarea>

<label>Skills (Comma Separated)</label>
<textarea id="skills"></textarea>

<label>Education</label>
<textarea id="education"></textarea>

<label>Experience</label>
<textarea id="experience"></textarea>

<label>Projects</label>
<textarea id="projects"></textarea>

<div class="buttons">

<button id="download">
<i class="fa-solid fa-file-pdf"></i>
Download PDF
</button>

<button id="print">
<i class="fa-solid fa-print"></i>
Print Resume
</button>

</div>

</div>

<!-- ================= RIGHT SIDE ================= -->

<div class="preview">

<div id="resume">

<div class="top">

<img src="https://via.placeholder.com/120"
id="previewPhoto">

<h1 id="previewName">
Your Name
</h1>

<h3 id="previewJob">
Job Title
</h3>

</div>

<hr>

<h2>Contact</h2>

<p>
<i class="fa-solid fa-envelope"></i>
<span id="previewEmail">
email@example.com
</span>
</p>

<p>
<i class="fa-solid fa-phone"></i>
<span id="previewPhone">
9876543210
</span>
</p>

<p>
<i class="fa-solid fa-location-dot"></i>
<span id="previewAddress">
India
</span>
</p>

<h2>Profile</h2>

<p id="previewSummary">
Professional Summary
</p>

<h2>Skills</h2>

<ul id="previewSkills">
<li>HTML</li>
<li>CSS</li>
<li>JavaScript</li>
</ul>

<h2>Education</h2>

<p id="previewEducation">
Your Education
</p>

<h2>Experience</h2>

<p id="previewExperience">
Your Experience
</p>

<h2>Projects</h2>

<p id="previewProjects">
Your Projects
</p>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
